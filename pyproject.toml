[project]
name = "riopaila-qa"
version = "0.1.0"
description = "Base de conocimiento semántico y sistema Q&A de Riopaila Castilla (TAAML · UAO · Grupo 3)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Melissa Palacios Domínguez" },
    { name = "Waldor Drada Arango" },
    { name = "Jorge Andrés Rivas Manzano" },
]
keywords = ["llm", "rag", "web-scraping", "langchain", "streamlit", "ollama", "riopaila-castilla"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Natural Language :: Spanish",
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "langchain-core>=1.7",
    "langchain-google-genai>=4.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.3",
    "langchain-text-splitters>=1.1.3",
    "lxml>=6.1.3",
    "pandas>=3.1.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "streamlit>=1.66.1",
    "tiktoken>=0.14.0",
    "trafilatura>=2.3.1",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
