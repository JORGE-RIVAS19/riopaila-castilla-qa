name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  calidad:
    name: Ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Instalar dependencias exactas del lockfile
        run: uv sync --locked
      - name: Lint (Ruff)
        run: uv run ruff check .
      - name: Formato (Ruff)
        run: uv run ruff format --check .
      - name: Pruebas (pytest, sin red ni LLM)
        run: uv run pytest
